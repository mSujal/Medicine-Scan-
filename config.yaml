ocr: 
  engine: tesseract
  languages: [eng]    
  psm: 11


preprocess: 
  clahe: false 
  clip_limit: 2.5
  upscale: true 
  min_long_side: 1600   # upscale smaller images before OCR 
  deskew: true      
  denoise: false


embedder: 
  name: mobilenetv2
  input_size: 224


fusion: 
  w_text: 0.7
  w_img: 0.3


decision: 
  min_score: 0.5      # placeholder, to be calibrated on validation set 
  min_margin: 0.1


matcher: 
  min_ratio: 80
  min_len: 4
  max_ngram: 3


paths: 
  reference_db: data/reference_db.csv
  index: data/index.npz
